<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auditoría de Redes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f5f0;
      --surface: #ffffff;
      --text: #1a1a18;
      --muted: #6b6b65;
      --border: #e2dfd8;
      --tag-bg: #efefeb;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2rem 1.5rem;
      max-width: 580px;
      width: 100%;
    }

    @media (min-width: 480px) {
      body { padding: 2rem; }
      .card { padding: 2.5rem 3rem; }
    }

    .tag {
      display: inline-block;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: var(--tag-bg);
      color: var(--muted);
      padding: 4px 10px;
      border-radius: 2px;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(1.4rem, 5vw, 2rem);
      font-weight: 400;
      line-height: 1.2;
      color: var(--text);
      margin-bottom: 1.5rem;
    }

    .section-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    /* Lista de descargas */
    .download-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .download-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 4px;
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
    }

    .download-item:hover  { border-color: #aaa; background: #fafaf8; }
    .download-item:active { transform: scale(0.99); }

    .item-icon {
      width: 40px;
      height: 40px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-pdf   { background: #fff0f0; }
    .icon-drive { background: #f0fff4; }

    .item-info {
      flex: 1;
      min-width: 0; /* evita overflow en mobile */
    }

    .item-info .name {
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-info .meta {
      font-size: 10px;
      color: var(--muted);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (min-width: 400px) {
      .item-info .name { font-size: 13px; }
      .item-info .meta { font-size: 11px; }
    }

    .item-badge {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 7px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .badge-pdf   { background: #fff0f0; color: #c0392b; }
    .badge-drive { background: #f0fff4; color: #1e7e40; }

    .item-arrow { color: var(--muted); flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="card">
    <span class="tag">Auditoría de Redes</span>
    <h1>Ejecución de la auditoría en la empresa</h1>

    <p class="section-label">Descargar</p>
    <div class="download-list">

      <!-- PDF -->
      <a class="download-item" href="Equipo1_Auditoria_Empresa.pdf" download="Equipo1_Auditoria_Empresa.pdf">
        <div class="item-icon icon-pdf">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="9" y1="13" x2="15" y2="13"/>
            <line x1="9" y1="17" x2="15" y2="17"/>
            <line x1="9" y1="9" x2="11" y2="9"/>
          </svg>
        </div>
        <div class="item-info">
          <div class="name">Equipo 1 — Auditoría de empresa</div>
          <div class="meta">Equipo1_Auditoria_Empresa.pdf</div>
        </div>
        <span class="item-badge badge-pdf">PDF</span>
        <svg class="item-arrow" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </a>

      <!-- Drive: Videos -->
      <a class="download-item" href="https://drive.google.com/drive/folders/TU_CARPETA_ID" target="_blank" rel="noopener noreferrer">
        <div class="item-icon icon-drive">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1e7e40" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 19 22 19"/>
            <line x1="12" y1="2" x2="7" y2="19"/>
            <line x1="12" y1="2" x2="17" y2="19"/>
          </svg>
        </div>
        <div class="item-info">
          <div class="name">Videos de la auditoría</div>
          <div class="meta">Google Drive — Equipo 1</div>
        </div>
        <span class="item-badge badge-drive">DRIVE</span>
        <svg class="item-arrow" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
      </a>

    </div>
  </div>
</body>
</html>
